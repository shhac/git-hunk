name: CI

on:
  push:
    branches:
      - main
      - 'paul/**'
  pull_request:


jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Zig
        uses: shhac/setup-zig@215585c45325702506a3e8d6f4c9319073668d5f # v2.2.1-node24
        with:
          version: '0.16.0'

      - name: Check formatting
        run: zig fmt --check src/ tools/ build.zig build.zig.zon

      - name: Check documentation drift
        run: zig build docs -- --check

      - name: Run unit tests
        run: zig build test

      - name: Run integration tests
        run: zig build test-integration

      # Package exactly as a release does and read the tarball, so a workflow
      # edit that drops the man page or a completion file fails here rather
      # than shipping.
      - name: Package release artifact
        run: |
          zig build
          tools/package-release.sh ci-check

      - name: Verify release artifact contents
        run: tests/check-release-artifact.sh git-hunk-ci-check.tar.gz

  # The matrix comes from tests/hostile-profiles.sh rather than being copied
  # here, so adding a profile there adds a CI job with no workflow edit.
  hostile-profiles:
    name: Enumerate hostile config profiles
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: List profiles
        id: list
        run: echo "profiles=$(tests/run-hostile.sh --list | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  hostile-config:
    name: Hostile git config (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: hostile-profiles
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.hostile-profiles.outputs.profiles) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Zig
        uses: shhac/setup-zig@215585c45325702506a3e8d6f4c9319073668d5f # v2.2.1-node24
        with:
          version: '0.16.0'

      - name: Build
        run: zig build

      # Re-runs the whole suite with git configured to write its diffs
      # differently, and requires the same assertion count as a default-config
      # run — a profile that silently emptied every diff would otherwise pass
      # by asserting nothing.
      - name: Run suite under hostile config
        run: tests/run-hostile.sh ./zig-out/bin/git-hunk ${{ matrix.profile }}
